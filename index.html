<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tägliche Losungen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

  <header>
    <span class="site-label">Tägliche Losungen</span>
    <h1 id="date-display"></h1>
    <div class="divider"></div>
  </header>

  <section class="controls">

    <div class="selector-row">
      <div class="selector-group">
        <label class="selector-label" for="lang-select" id="label-lang">Sprache</label>
        <select class="selector-input" id="lang-select">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="selector-group">
        <label class="selector-label" for="trans-select" id="label-trans">Übersetzung</label>
        <select class="selector-input" id="trans-select">
          <!-- populated by JS -->
        </select>
      </div>
    </div>

    <button class="btn-new" id="btn-new">Neue Losung</button>

  </section>

  <main id="losungen">
    <p class="loading">Lade Verse …</p>
  </main>

  <footer>
    <p>© Markus Fuchs · Täglich Wort</p>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
